<script>
const n=document.getElementById('n'),all=[...document.querySelectorAll('main img')],btns=[...document.querySelectorAll('nav button')];
let vis=all;
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&vis.includes(e.target))n.textContent=(vis.indexOf(e.target)+1)+' / '+vis.length})},{rootMargin:'-45% 0px -45% 0px'});
all.forEach(i=>io.observe(i));
function apply(f){
  if(!btns.some(b=>b.dataset.f===f))f='todo';
  btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===f));
  all.forEach(i=>i.classList.toggle('hide',f!=='todo'&&i.dataset.cat!==f));
  vis=all.filter(i=>!i.classList.contains('hide'));
  vis.slice(0,2).forEach(i=>i.loading='eager');
  n.textContent='1 / '+vis.length; window.scrollTo(0,0);
}
btns.forEach(b=>b.addEventListener('click',()=>{apply(b.dataset.f);history.replaceState(null,'',b.dataset.f==='todo'?location.pathname:'#'+b.dataset.f)}));
apply(location.hash.slice(1)||'todo');
</script>
